<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Para Estela ❤️ - FINAL</title>
    <style>
        :root {
            --rosa-claro: #ffdae0;
            --rosa-forte: #d6336c;
            --vinho-texto: #c2185b;
        }

        * { box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(-45deg, var(--rosa-claro), #ffafbd, #ffc3a0, var(--rosa-forte));
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(214, 51, 108, 0.3);
            width: 90%;
            max-width: 450px;
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 { 
            font-family: 'Dancing Script', cursive; 
            font-size: 2.2em; 
            color: var(--rosa-forte); 
            margin-bottom: 10px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .photo-container {
            position: relative;
            height: 110px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .photo-container:hover { transform: scale(1.05); }

        .photo-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-fallback {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(45deg, var(--rosa-forte), var(--rosa-claro));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Dancing Script', cursive;
            font-size: 0.9em;
            text-align: center;
            padding: 5px;
            opacity: 0;
            pointer-events: none;
        }

        .photo-fallback.show { opacity: 1; }

        .final-image {
            width: 100%;
            max-width: 280px;
            border-radius: 20px;
            border: 6px solid white;
            box-shadow: 0 15px 35px rgba(214, 51, 108, 0.4);
            margin-top: 15px;
            animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .final-video {
            width: 100%;
            max-width: 280px;
            border-radius: 20px;
            border: 6px solid white;
            box-shadow: 0 15px 35px rgba(214, 51, 108, 0.4);
            margin-top: 15px;
            animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .happy-birthday-text {
            font-family: 'Dancing Script', cursive; 
            color: var(--vinho-texto);
            font-size: 2.8em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        .modal img { max-width: 80%; max-height: 60vh; border-radius: 20px; border: 3px solid white; }
        .poema { margin-top: 20px; font-family: 'Dancing Script', cursive; font-size: 1.5rem; padding: 0 20px; }

        .magic-area {
            position: fixed;
            bottom: 30px;
            text-align: center;
            width: 100%;
            cursor: pointer;
            z-index: 20;
        }

        #magic-element { font-size: 70px; transition: all 0.5s ease; }

        .transforming { animation: enhancedMorph 2s forwards; }

        @keyframes enhancedMorph {
            0% { transform: scale(1) rotate(0deg); filter: blur(0px); }
            50% { transform: scale(2.5) rotate(180deg); filter: blur(10px); color: gold; }
            100% { transform: scale(1.5) rotate(360deg); filter: blur(0px); opacity: 0; }
        }

        button {
            padding: 12px 30px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            background: var(--rosa-forte);
            color: white;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        #no { background: #f1f3f5; color: #adb5bd; }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            h1 { font-size: 1.8em; }
            .photo-container { height: 90px; }
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1>PARABENS MEU BEM💞</h1>
        <p>🤍</p>
        <div id="btn-container" style="position: relative; height: 60px; display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px;">
            <button id="yes">TE AMO</button>
            <button id="no">CLIQUE AQUI</button>
        </div>
    </div>

    <div class="magic-area" id="magic-trigger" style="display: none;">
        <div id="magic-element">❤️</div>
        <p id="magic-status" style="color: var(--rosa-forte); font-weight: bold;">Toque no coração.</p>
    </div>

    <div id="myModal" class="modal">
        <span id="closeModal" style="position:absolute; top:20px; right:30px; font-size:40px; cursor:pointer; color: white;">&times;</span>
        <img id="modal-img" loading="lazy">
        <div id="poema-texto" class="poema"></div>
    </div>

    <script>
        // URLs editáveis - troque pelos links ImgBB
        const IMG_URLS = {
            foto1: 'https://i.ibb.co/URL_FOTO1_AQUI/foto1.jpg',
            foto2: 'https://i.ibb.co/URL_FOTO2_AQUI/foto2.jpg',
            foto3: 'https://i.ibb.co/URL_FOTO3_AQUI/foto3.jpg',
            foto4: 'https://i.ibb.co/URL_FOTO4_AQUI/foto4.jpg',
            video: 'https://i.imgur.com/URL_VIDEO_AQUI.mp4'
        };

        const noBtn = document.getElementById('no');
        const yesBtn = document.getElementById('yes');
        const card = document.getElementById('main-card');
        const magicArea = document.getElementById('magic-trigger');
        const magicElement = document.getElementById('magic-element');

        // Botão NÃO foge
        noBtn.addEventListener('mouseover', () => {
            const x = (Math.random() - 0.5) * window.innerWidth * 0.7;
            const y = (Math.random() - 0.5) * window.innerHeight * 0.7;
            noBtn.style.position = 'fixed';
            noBtn.style.left = '50%';
            noBtn.style.top = '50%';
            noBtn.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        });

        // Botão SIM gera a foto e o poema
        yesBtn.addEventListener('click', () => {
            card.innerHTML = `
                <h1>Para Minha Estela ❤️</h1>
                <div class="photo-grid">
                    <div class="photo-container" onclick="abrirPoema(IMG_URLS.foto1, 'O teu sorriso ilumina qualquer escuridão. ✨')">
                        <img src="${IMG_URLS.foto1}" alt="Foto 1" onerror="this.nextElementSibling.classList.add('show')">
                        <div class="photo-fallback">💕 O teu sorriso 💕</div>
                    </div>
                    <div class="photo-container" onclick="abrirPoema(IMG_URLS.foto2, 'O teu abraço é o meu abrigo favorito no mundo. 🏠')">
                        <img src="${IMG_URLS.foto2}" alt="Foto 2" onerror="this.nextElementSibling.classList.add('show')">
                        <div class="photo-fallback">❤️ Nosso abraço</div>
                    </div>
                    <div class="photo-container" onclick="abrirPoema(IMG_URLS.foto3, 'Sou grato por cada segundo ao teu lado. ☀️')">
                        <img src="${IMG_URLS.foto3}" alt="Foto 3" onerror="this.nextElementSibling.classList.add('show')">
                        <div class="photo-fallback">☀️ Momentos</div>
                    </div>
                    <div class="photo-container" onclick="abrirPoema(IMG_URLS.foto4, 'Prometo te amar em cada detalhe, sempre. 💖')">
                        <img src="${IMG_URLS.foto4}" alt="Foto 4" onerror="this.nextElementSibling.classList.add('show')">
                        <div class="photo-fallback">💖 Amor eterno</div>
                    </div>
                </div>
                <p style="font-size: 0.85em; margin-top: 15px; color: #666;">Clique nas fotos acima e depois no coração lá embaixo!</p>
            `;
            magicArea.style.display = 'block';
        });

        function abrirPoema(src, texto) {
            document.getElementById('myModal').style.display = "flex";
            document.getElementById('modal-img').src = src;
            document.getElementById('poema-texto').innerHTML = texto;
        }

        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
        }
        document.getElementById('closeModal').addEventListener('click', closeModal);

        let isAnimating = false;

        /* NOVO CSS para coração pulsante e carta */
        const style = document.createElement('style');
        style.textContent = `
            .heart-vibrate {
                font-size: 4em;
                animation: vibrate 1s infinite;
                cursor: pointer;
                margin: 20px 0;
                transition: transform 0.3s;
            }
            .heart-vibrate:hover { transform: scale(1.2); }
            @keyframes vibrate {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-2px); }
                75% { transform: translateX(2px); }
            }
            .letter-container {
                display: none;
                animation: fadeIn 0.8s ease-in;
                text-align: center;
                padding: 20px;
                font-family: 'Dancing Script', cursive;
            }
            .letter-text {
                font-size: 1.3em;
                line-height: 1.6;
                color: var(--vinho-texto);
                background: rgba(255,255,255,0.9);
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(214, 51, 108, 0.3);
                max-width: 400px;
                margin: 0 auto;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // SURPRESA FINAL COM VÍDEO + CARTA
        magicArea.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;

            magicElement.innerHTML = "🎂"; 
            magicElement.classList.add('transforming');
            document.getElementById('magic-status').innerHTML = "Preparando a surpresa...";

            setTimeout(() => {
                card.style.background = "rgba(255, 255, 255, 0.98)";
                
                card.innerHTML = `
                    <div class="happy-birthday-text">Feliz Aniversário!</div>
                    <div id="video-wrapper">
                        <video id="finalVideo" class="final-video" preload="metadata" autoplay loop muted playsinline style="width: 100%; border-radius: 20px; object-fit: cover;">
                            <source src="../static/video.mp4.mp4" type="video/mp4">
                        </video>
                        <div class="heart-vibrate" onclick="revelarCarta()">💌</div>
                        <p style="color: var(--rosa-forte); font-weight: bold;">Clique no coração para ler minha carta...</p>
                    </div>
                    
                    <div id="minhaCarta" class="letter-container">
                        <div class="letter-text">
                            Minha querida Estela, <br><br>
                            Eu te amo muitao kkk. A mais so Deus sabe o quando eu te amo,<br>
                            e nunca vou me cansar de dizer que EU TE AMO<br><br>
                            Neste dia tão especial, só quero que saiba voce e muito importante pra min. <br><br>
                            Com amor, <br>
                            [EU GUSTAVO] ❤️
                        </div>
                    </div>
                `;
                
                magicArea.style.display = 'none';
                // Inicialmente esconde a carta
                document.getElementById('minhaCarta').style.display = 'none';
            }, 1500);
        });

        // Nova função para mostrar a carta
        function revelarCarta() {
            const videoWrapper = document.getElementById('video-wrapper');
            const carta = document.getElementById('minhaCarta');
            
            videoWrapper.style.display = 'none'; // Esconde o vídeo e o coração pulsante
            carta.style.display = 'block'; // Mostra a carta
        }
    </script>
</body>
</html>
