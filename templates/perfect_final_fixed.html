<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d6336c">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Para Estela ❤️ - FINAL PERFEITO</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js');
        });
      }
    </script>
    <style>
        :root {
            --rosa-claro: #ffdae0;
            --rosa-forte: #d6336c;
            --vinho-texto: #c2185b;
        }

        * { box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(-45deg, var(--rosa-claro), #ffafbd, #ffc3a0, var(--rosa-forte));
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(214, 51, 108, 0.3);
            width: 90%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 { 
            font-family: 'Dancing Script', cursive; 
            font-size: 2.2em; 
            color: var(--rosa-forte); 
            margin-bottom: 10px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .photo-container {
            position: relative;
            height: 110px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .photo-container:hover { transform: scale(1.05); }

        .photo-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-fallback {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(45deg, var(--rosa-forte), var(--rosa-claro));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Dancing Script', cursive;
            font-size: 0.9em;
            text-align: center;
            padding: 5px;
            opacity: 0;
            pointer-events: none;
        }

        .photo-fallback.show { opacity: 1; }

        .final-image {
            width: 100%;
            max-width: 280px;
            border-radius: 20px;
            border: 6px solid white;
            box-shadow: 0 15px 35px rgba(214, 51, 108, 0.4);
            margin-top: 15px;
            animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .final-video {
            width: 100%;
            max-width: 280px;
            border-radius: 20px;
            border: 6px solid white;
            box-shadow: 0 15px 35px rgba(214, 51, 108, 0.4);
            margin-top: 15px;
            animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fullscreen-btn {
            background: rgba(255,255,255,0.9);
            color: var(--rosa-forte);
            padding: 8px 16px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .happy-birthday-text {
            font-family: 'Dancing Script', cursive; 
            color: var(--vinho-texto);
            font-size: 2.8em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        .modal img { max-width: 80%; max-height: 60vh; border-radius: 20px; border: 3px solid white; }
        .poema { margin-top: 20px; font-family: 'Dancing Script', cursive; font-size: 1.5rem; padding: 0 20px; }

        .magic-area {
            position: fixed;
            bottom: 30px;
            text-align: center;
            width: 100%;
            cursor: pointer;
            z-index: 20;
        }

        #magic-element { font-size: 70px; transition: all 0.5s ease; }

        .transforming { animation: enhancedMorph 2s forwards; }

        @keyframes enhancedMorph {
            0% { transform: scale(1) rotate(0deg); filter: blur(0px); }
            50% { transform: scale(2.5) rotate(180deg); filter: blur(10px); color: gold; }
            100% { transform: scale(1.5) rotate(360deg); filter: blur(0px); opacity: 0; }
        }

        button {
            padding: 15px 35px;
            min-height: 52px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            background: var(--rosa-forte);
            color: white;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-size: 1.1em;
        }

        #no { background: #f1f3f5; color: #adb5bd; }

        @media (max-width: 600px) {
            .card { padding: 20px; max-height: 85vh; }
            h1 { font-size: 1.8em; }
            .photo-container { height: 90px; }
            .final-video { max-width: 220px; }
            .happy-birthday-text { font-size: 2em; }
            .letter-text { padding: 20px; font-size: 1.1em; }
        }

        #heartRain {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1>PARABENS MEU BEM💞</h1>
        <p>🤍</p>
        <div id="btn-container" style="position: relative; height: 60px; display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px;">
            <button id="yes">TE AMO</button>
            <button id="no">CLIQUE AQUI</button>
        </div>
    </div>

    <div class="magic-area" id="magic-trigger" style="display: none;">
        <div id="magic-element">❤️</div>
        <p id="magic-status" style="color: var(--rosa-forte); font-weight: bold;">Toque no coração.</p>
    </div>

    <div id="myModal" class="modal">
        <span id="closeModal" style="position:absolute; top:20px; right:30px; font-size:40px; cursor:pointer; color: white;">&times;</span>
        <img id="modal-img" loading="lazy">
        <div id="poema-texto" class="poema"></div>
    </div>

    <canvas id="heartRain"></canvas>

    <script>
        // === LOCAL STATIC FILES ===
        const IMG_URLS = {
            foto1: '/static/foto1.jpeg.jpg',
            foto2: '/static/foto2.jpeg.jpg',
            foto3: '/static/foto3.jpeg.jpg',
            foto4: '/static/foto4.jpeg.jpeg',
            video: '/static/video.mp4.mp4'
        };

        const noBtn = document.getElementById('no');
        const yesBtn = document.getElementById('yes');
        const card = document.getElementById('main-card');
        const magicArea = document.getElementById('magic-trigger');
        const magicElement = document.getElementById('magic-element');

        // Botão NÃO foge
        noBtn.addEventListener('mouseover', () => {
            const x = (Math.random() - 0.5) * window.innerWidth * 0.7;
            const y = (Math.random() - 0.5) * window.innerHeight * 0.7;
            noBtn.style.position = 'fixed';
            noBtn.style.left = '50%';
            noBtn.style.top = '50%';
            noBtn.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        });

        // Botão SIM gera fotos
        yesBtn.addEventListener('click', () => {
            card.innerHTML = `
                <h1>Para Minha Estela ❤️</h1>
                <div class="photo-grid">
                    <div class="photo-container" onclick="abrirPoema('${IMG_URLS.foto1}', 'O teu sorriso ilumina qualquer escuridão. ✨')">
                        <img src="${IMG_URLS.foto1}" alt="Foto 1" onerror="this.nextElementSibling.classList.add('show')" loading="lazy">
                        <div class="photo-fallback">💕 O teu sorriso 💕</div>
                    </div>
                    <div class="photo-container" onclick="abrirPoema('${IMG_URLS.foto2}', 'O teu abraço é o meu abrigo favorito no mundo. 🏠')">
                        <img src="${IMG_URLS.foto2}" alt="Foto 2" onerror="this.nextElementSibling.classList.add('show')" loading="lazy">
                        <div class="photo-fallback">❤️ Nosso abraço</div>
                    </div>
                    <div class="photo-container" onclick="abrirPoema('${IMG_URLS.foto3}', 'Sou grato por cada segundo ao teu lado. ☀️')">
                        <img src="${IMG_URLS.foto3}" alt="Foto 3" onerror="this.nextElementSibling.classList.add('show')" loading="lazy">
                        <div class="photo-fallback">☀️ Momentos</div>
                    </div>
                    <div class="photo-container" onclick="abrirPoema('${IMG_URLS.foto4}', 'Prometo te amar em cada detalhe, sempre. 💖')">
                        <img src="${IMG_URLS.foto4}" alt="Foto 4" onerror="this.nextElementSibling.classList.add('show')" loading="lazy">
                        <div class="photo-fallback">💖 Amor eterno</div>
                    </div>
                </div>
                <p style="font-size: 0.85em; margin-top: 15px; color: #666;">Clique nas fotos acima e depois no coração lá embaixo!</p>
            `;
            magicArea.style.display = 'block';
        });

        function abrirPoema(src, texto) {
            document.getElementById('myModal').style.display = "flex";
            document.getElementById('modal-img').src = src;
            document.getElementById('poema-texto').innerHTML = texto;
        }

        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
        }
        document.getElementById('closeModal').addEventListener('click', closeModal);

        let isAnimating = false;

        /* CSS dinâmico para coração pulsante */
        const dynamicStyle = document.createElement('style');
        dynamicStyle.textContent = `
            .heart-vibrate {
                font-size: 4em;
                animation: vibrate 1s infinite;
                cursor: pointer;
                margin: 20px 0;
                transition: transform 0.3s;
            }
            .heart-vibrate:hover { transform: scale(1.2); }
            @keyframes vibrate {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-2px); }
                75% { transform: translateX(2px); }
            }
            .letter-container {
                animation: fadeIn 0.8s ease-in;
                text-align: center;
                padding: 20px;
                font-family: 'Dancing Script', cursive;
            }
            .letter-text {
                font-size: 1.3em;
                line-height: 1.6;
                color: var(--vinho-texto);
                background: rgba(255,255,255,0.9);
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(214, 51, 108, 0.3);
                max-width: 400px;
                margin: 0 auto;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(dynamicStyle);

        // Magia final: vídeo → coração pulsante → carta
        magicArea.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;

            magicElement.innerHTML = "🎂";
            magicElement.classList.add('transforming');
            document.getElementById('magic-status').innerHTML = "Preparando a surpresa...";

            setTimeout(() => {
                card.style.background = "rgba(255, 255, 255, 0.98)";
                card.innerHTML = `
                    <div class="happy-birthday-text">Feliz Aniversário Estela! 💕</div>
                    <video id="finalVideo" class="final-video" preload="metadata" autoplay loop muted playsinline x-webkit-airplay="allow" webkit-playsinline="true" style="width: 100%; max-width: 280px; border-radius: 20px; box-shadow: 0 15px 35px rgba(214, 51, 108, 0.4); margin: 15px auto; display: block;">
                        <source src="${IMG_URLS.video}" type="video/mp4">
                        Vídeo não suportado.
                    </video>
                    <button class="fullscreen-btn" onclick="toggleFullscreen()">📱 Tela Cheia</button>
                    <div class="heart-vibrate" onclick="revelarCarta()">💌</div>
                    <p style="color: var(--rosa-forte); font-weight: bold; font-size: 1.1em;">Clique para ler minha carta de amor...</p>
                    <div id="carta" class="letter-container" style="display: none;">
                        <div class="letter-text">
                            <strong>Minha querida Estela,</strong><br><br>
                            Eu te amo muitao kkk. A mais só Deus sabe o quanto eu te amo.<br>
                            Nunca vou me cansar de dizer que <strong>EU TE AMO</strong><br><br>
                            Neste dia tão especial, quero que saiba que você é MUITO importante pra mim.<br><br>
                            <strong>Com todo meu amor,<br>Gustavo ❤️</strong>
                        </div>
                    </div>
                `;
                magicArea.style.display = 'none';
            }, 2000);
        });

        function revelarCarta() {
            document.querySelector('.heart-vibrate').style.display = 'none';
            const carta = document.getElementById('carta');
            carta.style.display = 'block';
            // Chuva corações intensa
            createHeartRainIntense();
        }

        // Chuva corações suave no fundo
        function createHeartRain() {
            const canvas = document.getElementById('heartRain');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const hearts = [];
            for (let i = 0; i < 30; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 15 + 8,
                    speed: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.5 + 0.3
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(heart => {
                    ctx.save();
                    ctx.globalAlpha = heart.opacity;
                    ctx.font = `${heart.size}px Arial`;
                    ctx.fillText('💕', heart.x, heart.y);
                    ctx.restore();
                    heart.y += heart.speed;
                    if (heart.y > canvas.height + 50) {
                        heart.y = -50;
                        heart.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        // Chuva intensa na carta
        function createHeartRainIntense() {
            const canvas = document.getElementById('heartRain');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const hearts = [];
            for (let i = 0; i < 100; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * -200,
                    size: Math.random() * 25 + 12,
                    speed: Math.random() * 4 + 2,
                    opacity: Math.random() * 0.8 + 0.4,
                    sway: (Math.random() - 0.5) * 4
                });
            }

            let animationId;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(heart => {
                    heart.x += heart.sway;
                    ctx.save();
                    ctx.globalAlpha = heart.opacity;
                    ctx.font = `${heart.size}px Arial`;
                    ctx.fillText('❤️', heart.x, heart.y);
                    ctx.restore();
                    heart.y += heart.speed;
                    if (heart.y > canvas.height + 50) heart.y = -50;
                });
                animationId = requestAnimationFrame(animate);
            }
            animate();

        
            setTimeout(() => {
                cancelAnimationFrame(animationId);
            }, 8000);
        }

        // Inicia chuva suave
        createHeartRain();

        // Resize canvas
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('heartRain');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Função fullscreen vídeo
        function toggleFullscreen() {
          const video = document.getElementById('finalVideo');
          if (video.requestFullscreen) {
            video.requestFullscreen();
          } else if (video.webkitEnterFullscreen) { // iOS Safari
            video.webkitEnterFullscreen();
          }
        }

        // Orientação preferida portrait
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('portrait').catch(() => {});
        }
    </script>
</body>
</html>
